# ecfan - fan curve for Chromebooks running Linux.
#
# The EC's own automatic curve needs a host-side thermal packet that only
# ChromeOS' powerd provides, so on plain Linux the fan idles at its fallback
# speed regardless of load. ecfan drives the EC directly instead.
#
# Format: "temp_c:duty_percent" pairs, evaluated in order and interpolated.
# duty -> rpm measured on a Google Taeko: 12%=798, 20%=1652, 30%=2488, 100%=6182.
#
# The default curve idles at 20% (~1650 rpm) and ramps to 100% by 85 C.
# Under sustained 4-core load, 30% duty already holds the CPU at ~71 C, so
# this curve keeps real thermal headroom.

poll_seconds = 2
hysteresis = 3
min_duty = 20
curve = "45:20, 50:25, 55:30, 60:35, 65:45, 70:55, 75:70, 80:85, 85:100, 90:100"
